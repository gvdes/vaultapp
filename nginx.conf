# nginx: ejemplo de servidor para la SPA ya compilada (carpeta dist/spa).
# En producción pon esto detrás de HTTPS (certificado del dominio de la empresa).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # OPCIONAL (modo API): enviar /api/ al backend Laravel (php-fpm con el public/ de backend-laravel, o su servidor interno). Sin esto, /api cae en la
  # SPA y la app avisa "respuesta inesperada (no es JSON)". Si la API vive en otro dominio no hace falta: usar VITE_API_URL absoluta + CORS.
  # location /api/ {
  #   proxy_pass http://127.0.0.1:8081;          # ajustar al backend
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $remote_addr;   # y en el .env de la API: DGA_CONFIAR_PROXY=true
  #   client_max_body_size 12m;                  # subidas de archivos (la API acepta hasta 10 MB)
  # }

  # Rutas de la SPA (/sistemas, /solicitar, /verificar/equipo/123…) → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html sin caché; los assets tienen hash en el nombre y se cachean fuerte
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
